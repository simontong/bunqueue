#cloud-config
package_update: true
packages:
  - curl
  - unzip
  - sqlite3

runcmd:
  # Install Bun
  - curl -fsSL https://bun.sh/install | bash
  - ln -s /root/.bun/bin/bun /usr/local/bin/bun

  # Create directories
  - mkdir -p /opt/bunqueue /var/lib/bunqueue /var/log/bunqueue

  # Install bunqueue
  - cd /opt/bunqueue
  - /root/.bun/bin/bun add bunqueue

  # Create config
  - |
    cat > /opt/bunqueue/.env << 'ENV'
    # Server
    TCP_PORT=6789
    HTTP_PORT=6790
    DATA_PATH=/var/lib/bunqueue/queue.db

    # Auth
    AUTH_TOKENS=${auth_token}

    # Metrics
    METRICS_PORT=9091
    METRICS_ENABLED=true

    # Customer info
    CUSTOMER_ID=${customer_id}
    REGION=${region}

    # Limits
    MAX_QUEUE_DEPTH=100000
    MAX_JOB_SIZE=1048576

    # S3 Backup (optional)
    S3_BACKUP_ENABLED=0
    ENV

  # Create systemd service
  - |
    cat > /etc/systemd/system/bunqueue.service << 'SERVICE'
    [Unit]
    Description=bunqueue Job Queue Server
    After=network.target

    [Service]
    Type=simple
    User=root
    WorkingDirectory=/opt/bunqueue
    EnvironmentFile=/opt/bunqueue/.env
    ExecStart=/root/.bun/bin/bun run node_modules/bunqueue/dist/main.js
    Restart=always
    RestartSec=5
    StandardOutput=append:/var/log/bunqueue/stdout.log
    StandardError=append:/var/log/bunqueue/stderr.log

    # Security
    NoNewPrivileges=true
    ProtectSystem=strict
    ProtectHome=true
    ReadWritePaths=/var/lib/bunqueue /var/log/bunqueue

    # Resource limits
    LimitNOFILE=65535
    LimitNPROC=4096

    [Install]
    WantedBy=multi-user.target
    SERVICE

  # Setup log rotation
  - |
    cat > /etc/logrotate.d/bunqueue << 'LOGROTATE'
    /var/log/bunqueue/*.log {
      daily
      rotate 7
      compress
      delaycompress
      missingok
      notifempty
      create 0640 root root
      postrotate
        systemctl reload bunqueue > /dev/null 2>&1 || true
      endscript
    }
    LOGROTATE

  # Setup automatic updates
  - |
    cat > /etc/cron.daily/bunqueue-update << 'UPDATE'
    #!/bin/bash
    cd /opt/bunqueue
    /root/.bun/bin/bun update bunqueue
    systemctl restart bunqueue
    UPDATE
  - chmod +x /etc/cron.daily/bunqueue-update

  # Start service
  - systemctl daemon-reload
  - systemctl enable bunqueue
  - systemctl start bunqueue

  # Health check endpoint test
  - sleep 5
  - curl -f http://localhost:6790/health || echo "Health check failed"
