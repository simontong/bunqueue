global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'router'
    static_configs:
      - targets: ['router:6800']
    metrics_path: /health

  - job_name: 'bunqueue-nodes'
    static_configs:
      - targets:
          - 'node1:6790'
          - 'node2:6790'
          - 'node3:6790'
          - 'node4:6790'
          - 'node5:6790'
    metrics_path: /metrics
